<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="116" height="116" viewBox="0 0 116 116" shape-rendering="crispEdges">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;} .glow{filter:url(#g)} </style>
<defs><filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#ffffff" opacity="0.025"/></pattern></defs>
<rect x="3" y="3" width="110" height="110" fill="#0e0b2b" stroke="#2a2550" stroke-width="4"/><rect x="7" y="7" width="102" height="5" fill="#fcc624"/><text x="58.0" y="62" fill="#fcc624" font-size="32" font-weight="bold" text-anchor="middle" class="glow">LX</text><text x="58.0" y="92" fill="#e2e8f0" font-size="13" text-anchor="middle">Linux</text><rect x="3" y="3" width="110" height="110" fill="none" stroke="#facc15" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.03;.07;1" dur="9.6s" begin="8.4s" repeatCount="indefinite"/></rect>
<rect width="116" height="116" fill="url(#scan)" pointer-events="none"/>
</svg>