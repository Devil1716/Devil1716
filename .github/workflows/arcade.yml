name: Repo arcade
on:
  issues:
    types: [opened]
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: arcade
  cancel-in-progress: false
jobs:
  play:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'gh|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Run arcade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ARCADE_COMMENT: ${{ runner.temp }}/comment.md
        run: python scripts/arcade.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add game assets/arcade README.md
          git diff --cached --quiet || git commit -m "Repo arcade update"
          git pull --rebase && git push
      - name: Reply and close
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
